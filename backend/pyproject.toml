[project]
name = "walkworth"
version = "0.1.0"
description = "A spoken trek journal. Walk it. Say it. Keep it."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "temporalio>=1.34.0",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "tzdata>=2026.5",
    "av>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["walkworth"]
