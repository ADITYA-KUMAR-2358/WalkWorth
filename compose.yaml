services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
    ports:
      - "7234:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:10001,http://127.0.0.1:10001
    ports:
      - "7233:8080"

  walkworth:
    build: .
    depends_on:
      - temporal
    env_file:
      - .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      WALKWORTH_EMBEDDED_WORKER: "1"
    command: ["backend/.venv/bin/uvicorn", "walkworth.api:app", "--host", "0.0.0.0", "--port", "10000"]
    ports:
      - "10001:10000"
    volumes:
      - walkworth-data:/app/data

volumes:
  temporal-postgres:
  walkworth-data:
