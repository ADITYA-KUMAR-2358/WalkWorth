<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A spoken trek journal. Walk it. Say it. Keep it." />
    <meta name="theme-color" content="#ECF0ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101714" media="(prefers-color-scheme: dark)" />
    <title>Walkworth</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        const t = localStorage.getItem("ww-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
